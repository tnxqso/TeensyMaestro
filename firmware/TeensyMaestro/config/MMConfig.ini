; ------------------------------------------------------------------------------
; CW Macros (CW Msg)
; Up to 12 messages. Each "CW Msg:" line defines one macro, in order.
;
; Supported tokens (case-insensitive):
;   $C       Inserts your callsign exactly as configured (letters + digits),
;            e.g. "W1AW".
;   $Snn     Temporary speed change to nn WPM (1–3 digits). Example:
;              $S18 CQ CQ DE $C $S21
;            This slows to 18 WPM, then returns to 21 WPM.
;            Use $SPnn to also update the saved baseline speed (permanent).
;   $N       Contest serial. Variants:
;              $N<space>  sends current serial and increments.
;              $N+        increments serial (no send).
;              $N-        decrements serial (min 1, no send).
;              $NR        sends previous serial (no increment).
;   $Pms     Pause for ms milliseconds (e.g. $P500).
;   *AR *SK *HH  Prosigns AR, SK, HH (sent without letter spacing).
;
; Tips:
; - Place inline comments on their own lines to avoid confusing the parser.
; - Spaces in macros are literal word gaps on-air.
; - $C expands to the full callsign including digits; do not append digits after $C.
; - Example set:
;     CW Msg: $C
;     CW Msg: R 5NN TU
;     CW Msg: DE $C
;     CW Msg: CQ CQ DE $C K
;     CW Msg: QSL TU 73 DE $C
;     CW Msg: QRZ? DE $C
;     CW Msg: $S18 CQ CQ DE $C $S21
;     CW Msg: $P500 TU 73 DE $C *AR
; ------------------------------------------------------------------------------
CW Msg: $C                                         ; #1
CW Msg: R 5NN CO                                   ; #2
CW Msg: TEST DE W1AW                               ; #3
CW Msg: CQ CQ CQ DE $C $C $P5000 $R                ; #4  CQ loop with pause and repeat
CW Msg: *AR *SK *HH                                ; #5  sample prosigns
CW Msg: Flex 64__ ES KPA 5__ at 5__ W              ; #6  “_” = long dash (cut 0)
CW Msg: DE $C                                      ; #7
CW Msg: $S35 R 5NN CO $S QRZ?                      ; #8  temp 35 WPM then restore
CW Msg: NR $N CO                                   ; #9
CW Msg: $NR CO                                     ; #10 previous serial
CW Msg: $N+                                        ; #11 increment serial only
CW Msg: $N-                                        ; #12 decrement serial only

CW Word Spaces: 0	; Additional dot lengths to be added to word spacing when sending CW memories.

ShowSpots: Yes  ; May be necessary to turn off spots under high network latency conditions

