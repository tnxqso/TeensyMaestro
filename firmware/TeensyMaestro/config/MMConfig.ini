; ---------------------------------------------------------------------------
; FLEX RADIO CONNECTION
; With Connect: ANY, TeensyMaestro can discover the radio (UDP 4992) or
; connect directly to a fixed target depending on Connection Mode + Flex Host.
;
; Protocols (Flex-6xxx standard):
;   TCP 4992   = Control/command session (what you use with PuTTY or FlexLib)
;   UDP 4992   = Discovery (radio -> LAN broadcast/unicast, ignored in Fixed mode)
;   UDP <N>    = VITA-49 metering/waterfall stream (radio -> client); default 4991
;
; Connection Mode (applies ONLY when Connect: ANY):
;   Auto             = Always use discovery (default).
;   Fixed            = Connect directly to Flex Host (no discovery).
;   Fixed+Failover   = Try Flex Host first; if it fails, fall back to discovery.
;
; IMPORTANT:
; - Flex Host accepts either a DNS-resolvable hostname or an IPv4 address.
;     If a hostname is used, TeensyDNS (or DHCP-provided DNS) must be valid.
; - If Connect specifies a serial number, discovery is always used and both
;     Connection Mode and Flex Host are ignored.
; - The port numbers below refer to the FlexRadio services themselves.
;     In LAN mode (Auto/Discovery), these defaults usually work without changes.
;     In WAN/Fixed mode, the remote router must forward the ports from WAN → radio LAN IP.
; ---------------------------------------------------------------------------

Connection Mode: Fixed
Flex Host: remoteqth.narva2.net     ; Flex hostname or IPv4 (ignored if Connect is a serial number)

Flex Control Port: 4992             ; TCP control/command session (default 4992)

Out Of Band Indicator: ON
Out Of Band Spot Time: 5

