; ---------------------------------------------------------------------------
; TIME & CLOCK DISPLAY
; Controls if a clock is shown, which time zone to use, how date/time are
; formatted, and which NTP server to sync with.
;
; Show Date/Time:
;   Yes  = render date/time somewhere in the UI (actual placement is handled in firmware)
;   No   = hide date/time UI
Show Date/Time: Yes

; Time Zone:
;   Specify the time zone using a standard IANA TZ database name.
;   For a full list, see: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
;   Examples:
;     Asia/Seoul
;     America/New_York
;     UTC
;
;   Special cases:
;     - "UTC" gives Coordinated Universal Time (no DST). Good for QSO logging in UTC
;     - "GMT+N" or "GMT-N" are supported as fixed whole-hour offsets (no DST).
;       Examples: "GMT+2", "GMT-3".
;
;   Note: Formats like "UTC+02:00" or "+05:30" are not supported.
;
Time Zone: Europe/London

; Date Format:
;   Uses a small, POSIX strftime-like subset (fixed English names).
;   Supported directives: %%, %a, %b, %d, %-d, %m, %-m, %Y, %H, %-H, %M, %-M, %S, %-S, %I, %-I, %p
;   Notes:
;     - %-d, %-m, %-H, %-M, %-S, %-I remove leading zeros (e.g., %-d -> 3 instead of 03).
;     - %a is weekday abbreviation (Sun, Mon, ...), %b is month abbreviation (Jan, Feb, ...).
;     - Unknown tokens are emitted literally.
;   Examples:
;     %Y-%m-%d        -> 2025-02-14
;     %d/%m/%Y        -> 14/02/2025
;     %b %-d, %Y      -> Feb 14, 2025
;     %a %-d %b %Y    -> Sun 14 May 2014
Date Format: %a %-d %b %Y

; Time Format (whitelisted values only)
;   Choose exactly one of the following:
;
;   24-hour:
;     %H:%M           -> 21:07
;     %H:%M:%S        -> 21:07:05
;
;   12-hour (AM/PM):
;     %I:%M %p        -> 09:07 PM
;
; Notes:
;   - 12-hour WITH seconds (e.g., "%I:%M:%S %p") is NOT supported.
;   - In 12-hour mode, AM/PM is shown in the seconds area.
;   - If you need seconds on the line, choose a 24-hour format.
Time Format: %H:%M:%S

;   Set this to "Yes" if you live in one of the three countries on Earth
;   that still insist on using Fahrenheit and other imperial oddities.
;   Everyone else can safely leave it at "No" and enjoy Celsius.
;
;   Yes  -> Temperature in °F
;   No   -> Temperature in °C
Use Imperial Units: No 

