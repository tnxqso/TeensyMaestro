; TeensyMaestro Community Edition MMConfig.ini file
; Comments start with a semi colon
; See the TeensyMaestro User Manual for more information about these parameters

Connect: ANY    ; ANY = no specific serial. Behavior is then controlled by Connection Mode + Flex Host.
                ; Or put an exact radio serial (e.g. 1319-9535-6600-0028) to target that radio via discovery.
                ; NOTE: If a serial is used, discovery is ALWAYS used and both Connection Mode and Flex Host are ignored.

MyCall: W1AW  ; Probably want your own call here...

; Up to 5 license classes can be set up for your country.  
; These are the US entries (yes, there are still Advanced and Novice class licensees):
License Class 1: Extra
License Class 2: Advanced
License Class 3: General
License Class 4: Technician
License Class 5: Novice

MyLicense: Extra  ; Extra, Advanced, General, Technician, Tech, Novice  (Note: this line must be after the 5 
; License Class definitions and must match one of the five entries above.  Tech and Technician are equivalent.)

TeensyMaestroID: KD0RC   ; Only used in standalone mode (no spaces allowed).

Splash: 0  ; how long to leave the splash screen up in milliseconds
Screen Save: 1200  ; Screen Saver time out in seconds. Default = 1200 (20 mins)

Power Button: Power  ; Power, Power Fast, Reset    Default is Power

WPM: 21           ; Default WPM used only in Stand-Alone mode (no FlexRadio connected). 
                  ; When connected to a FlexRadio, the CW speed is always synced from the radio.
                  ; Comment out this line to start with the last used WPM in Stand-Alone mode.

CW Delay:   200   ; CW hang time in milliseconds. Default = 0.
                  ; If set greater than 0, this value is pushed to the FlexRadio on connect.
                  ; If set to 0, TeensyMaestro does not modify the radio’s current CW Delay setting.
                  ;
                  ; CW Delay is the "Hang Time" that passes after sending CW before the radio and amplifier 
                  ; return to receive mode. This prevents relay chatter between CW characters.
                  ;
                  ; IMPORTANT:
                  ; If TX Delay > 0, CW Delay must be longer than TX Delay to prevent hot-switching 
                  ; (amplifier or transverter key-up damage).
                  ;
                  ; Example: TX Delay = 20, CW Delay = 25 (or higher)

Show Contest Serial Number: No; Yes, No   (default = No)
                             ; When ON, the CW Contest Serial number is shown on the main screen.

; ---------------------------------------------------------------------------
; VFO ENCODER BEHAVIOR
; Controls how the VFO tuning knobs respond — both the base rate and
; how acceleration scales with faster rotation.
; ---------------------------------------------------------------------------

VFO Tracking: OFF    ; ON, OFF   (default = OFF)
                     ; When ON, the inactive VFO follows the active one’s frequency.

; ---------------------------------------------------------------------------
; BASE TUNING RATES
;
; The “Default Rate” defines the encoder’s basic sensitivity — how many
; tuning counts per second result in a 1 Hz frequency change.
; Lower numbers make tuning more responsive (faster per detent).
; ---------------------------------------------------------------------------

VFO A SSB Default Rate: 40    ; lower = faster (default 40)
VFO B SSB Default Rate: 40
VFO A CW Default Rate: 20
VFO B CW Default Rate: 20

; ---------------------------------------------------------------------------
; VFO ACCELERATION — BASIC SETTINGS
;
; Enables and scales dynamic tuning acceleration when spinning faster.
; Acceleration multiplies the current step size based on knob speed.
; ---------------------------------------------------------------------------

; Acceleration aggressiveness scaling:
;   Smaller  -> stronger acceleration (more responsive)
;   Larger   -> weaker acceleration (slower ramp)
; Valid range: 200 – 6000   (default = 600)
; Tip: halve/double this value to quickly sense the effect.
VFO Acceleration Factor: 600


; ---------------------------------------------------------------------------
; VFO ACCELERATION — ADVANCED TUNING
;
; Fine-tune how quickly acceleration engages, how long it holds, and how
; smoothly it ramps up or down. If in doubt, leave the defaults.
;
; Notes:
; - These controls apply only when "VFO Acceleration" is ON.
; - Processing runs roughly every 10 ms (“per tick”).
; - Multipliers that reference “Step” scale with your current VFO step size.
; ---------------------------------------------------------------------------

; Engage threshold factor:
;   Lower -> engages earlier (more eager)
;   Higher -> engages later (requires faster rotation)
; Valid range: 1.2 – 2.8   (default = 1.6)
; Example: with base rate 40, factor 1.8 → ~72 counts required to engage.
VFO Accel On Factor: 1.6

; Release (hysteresis) threshold factor:
;   Lower -> drops out sooner
;   Higher -> holds longer before releasing
; Valid range: 1.0 – 2.2   (default = 1.5)
; Example: with base rate 40, factor 1.5 → ~64 counts to disengage.
VFO Accel Off Factor: 1.5

; Minimum deadband on filtered count (“tail ignore zone”):
;   Lower -> more sensitive at very low speeds (may feel twitchy)
;   Higher -> ignores small motion after stopping (smoother feel)
; Valid range: 0 – 12   (default = 3)
VFO Accel Min Deadband: 3

; Count EMA denominator (smoothing of encoder counts before accel logic):
;   Lower -> faster reaction (snappier, possibly choppy)
;   Higher -> slower response (smoother and more stable)
; Valid range: 2 – 6   (default = 2)
; Effective formula: new = (old × (den − 1) + sample) / den
VFO Accel Count EMA Den: 2

; Acceleration EMA denominator (smoothing of the computed accel term):
;   Lower -> ramps up/down faster (nervous feel)
;   Higher -> ramps more slowly (gliding feel)
; Valid range: 4 – 10   (default = 4)
VFO Accel Accel EMA Den: 4

; Maximum per-tick change limits (slew limiting).
; Values are multipliers of the current Step size.
;   Up Mult:
;     Lower -> slower increase per tick (gentler onset)
;     Higher -> faster increase (more aggressive)
;   Down Mult:
;     Lower -> slower decay (holds momentum longer)
;     Higher -> faster decay (drops off quickly)
; Valid ranges:
;   Up Mult:   20 – 200   (default = 60)
;   Down Mult: 10 – 60    (default = 20)
VFO Accel Max Up Mult: 60
VFO Accel Max Down Mult: 20

; Absolute cap for computed acceleration (safety limit).
; The acceleration term will never exceed this value regardless of spin speed.
; Valid range: 10000 – 60000 Hz   (default = 20000)
VFO Accel Max Abs Hz: 20000
; ---------------------------------------------------------------------------

